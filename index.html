<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <!--<button type="one" id="oneNum" onclick="changePink()"> One </button>!-->
    
    <div class="calculator">
        <h1>Calculator</h1>
        <div class="input">
            <input type="text" id="display" value="0" readonly>
        </div>
        
        <div class="button-grid">
            <button class="function" onclick="notImplemented()">Conv</button>
            <button class="function" onclick="appendToDisplay('Math.sqrt(')">&radic;x</button>
            <button class="function" onclick="notImplemented()">y&radic;x</button>
            <button class="function" onclick="appendToDisplay('**')">x^y</button>
            <button class="function" onclick="appendToDisplay('Math.sin(')">Sin</button>
            
            <button class="number" onclick="appendToDisplay('7')">7</button>
            <button class="number" onclick="appendToDisplay('8')">8</button>
            <button class="number" onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('/')">&divide;</button>
            <button class="function" onclick="appendToDisplay('Math.cos(')">Cos&theta;</button>
            
            <button class="number" onclick="appendToDisplay('4')">4</button>
            <button class="number" onclick="appendToDisplay('5')">5</button>
            <button class="number" onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('*')">&times;</button>
            <button class="function" onclick="appendToDisplay('Math.log10(')">Log</button>

            <button class="number" onclick="appendToDisplay('1')">1</button>
            <button class="number" onclick="appendToDisplay('2')">2</button>
            <button class="number" onclick="appendToDisplay('3')">3</button>
            <button class="operator" onclick="appendToDisplay('-')">-</button>
            <button class="function" onclick="appendToDisplay('Math.log(')">ln</button>
            
            <button class="function" onclick="placeholder()">.-</button>
            <button class="number" onclick="appendToDisplay('0')">0</button>
            <button class="equals" onclick="calculate()">=</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>
            <button class="function" onclick="appendToDisplay('*10**')">&times;10^x</button>
        </div>
    </div>



</body>
</html>
